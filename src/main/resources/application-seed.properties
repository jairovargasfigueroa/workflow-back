# -----------------------------------------------------------------------
#  Perfil "seed" — Activar solo cuando quieras poblar la DB de prueba:
#
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,seed
#
#  O uno específico:
#
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,seed \
#                            -Dspring-boot.run.arguments=--seed=departamentos
#
#  En cualquier otro perfil, los beans del paquete seed/ no se cargan.
# -----------------------------------------------------------------------

# Cantidad de solicitudes a generar (para SolicitudesSeeder cuando se implemente)
seed.cantidad-solicitudes=2000

# Distribución temporal (días hacia atrás)
seed.distribuir-ultimos-dias=180

# Usuarios
seed.admins=5
seed.funcionarios-por-departamento=5
seed.solicitantes=250
